<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>تسجيل الدخول — العيادة</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function () {
  // لون الخلفية قبل تحميل التنسيق، حتى لا تومض الصفحة بالأبيض
  try {
    var k = /provider\.html$/i.test(location.pathname) ? 'clinicProviderPrefs' : 'clinicPrefs';
    var p = JSON.parse(localStorage.getItem(k) || '{}'), t = p.theme || 'dark';
    document.documentElement.style.background = t === 'glass' ? '#161618' : t === 'light' ? '#f6f6f7' : '#0b0c0e';
    document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
  } catch (e) { }
})();
</script>
<link rel="preconnect" href="https://pxxgydllfustqkpkfiqn.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="design.css?v=202610290">
<link rel="stylesheet" href="glass.css?v=202610290">
<script src="theme.js?v=202610290"></script>
<script src="pwa.js?v=202610290"></script>
</head>
<body class="standalone">
  <main class="sheet-card">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z"/></svg></div>
    <h1>تسجيل الدخول</h1>
    <p class="lead">أهلاً بعودتك، أدخل بيانات عيادتك للمتابعة</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>اسم المستخدم</span>
        <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" required></label>
      <label class="field"><span>كلمة المرور</span>
        <span class="pass"><input name="password" type="password" autocomplete="current-password" dir="ltr" required><button type="button" id="eye" aria-pressed="false">إظهار</button></span></label>
      <div class="form-error" id="error" role="alert"></div>
      <button type="submit" class="submit" id="submitBtn">دخول</button>
    </form>
    <div class="demo-entry">
      <span>ليس لديك حساب؟</span>
      <button type="button" class="demo-btn" id="demoBtn">جرّب البرنامج بدون حساب</button>
    </div>
    <p class="terms-line">باستخدامك البرنامج فأنت توافق على <a href="terms.html">شروط الاستخدام</a><br>للاشتراك والدعم: <a class="ltr" id="support" href="#"></a></p>
  </main>
  <script src="cloud.js?v=202610290"></script>
  <script>
    const form = document.getElementById('loginForm'), errorEl = document.getElementById('error'), btn = document.getElementById('submitBtn');
    document.getElementById('support').textContent = CLOUD.support;
    document.getElementById('support').href = 'tel:' + CLOUD.support;
    // من الرابط index.html?demo=1 (للإعلانات) أو من الزر
    document.getElementById('demoBtn').addEventListener('click', () => Auth.startDemo());
    if (new URLSearchParams(location.search).get('demo') === '1') Auth.startDemo();
    // داخل مسبقًا: يذهب للعيادة مباشرة
    Auth.guard();
    // خرج لأن الطبيب أوقف الجهاز، أو لأن العيادة وصلت لحد الأجهزة
    errorEl.textContent = Auth.takeForcedOut();
    document.getElementById('eye').addEventListener('click', e => {
      const i = form.elements.password, show = i.type === 'password';
      i.type = show ? 'text' : 'password'; e.target.textContent = show ? 'إخفاء' : 'إظهار'; e.target.setAttribute('aria-pressed', String(show));
    });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorEl.textContent = '';
      if (!form.elements.username.value.trim() || !form.elements.password.value) { errorEl.textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
      btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
      try {
        await Auth.login(form.elements.username.value, form.elements.password.value);
        location.replace(PAGES.app);
      } catch (err) {
        errorEl.textContent = err.message || 'تعذّر تسجيل الدخول';
        btn.disabled = false; btn.textContent = 'دخول';
      }
    });
    ClinicTheme.floatPicker();
  </script>
</body>
</html>
